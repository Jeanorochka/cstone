name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shared: [OFF, ON]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - run: cmake --install build --prefix stage --config Release
      - run: cmake -S tests/consumer -B consumer -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage
      - run: cmake --build consumer --config Release --parallel
      - if: runner.os != 'Windows'
        run: ./consumer/consumer_c && ./consumer/consumer_cpp
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\stage\bin;" + $env:PATH
          & .\consumer\Release\consumer_c.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\consumer\Release\consumer_cpp.exe
          exit $LASTEXITCODE
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCSTONE_SANITIZERS=ON -DCMAKE_C_COMPILER=clang
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - run: cmake -S . -B fuzz-build -DCMAKE_C_COMPILER=clang -DCSTONE_FUZZ=ON -DBUILD_TESTING=OFF -DCSTONE_BUILD_CLI=OFF -DCSTONE_BUILD_EXAMPLES=OFF
      - run: cmake --build fuzz-build --parallel
      - run: ./fuzz-build/cstone_fuzz -runs=100000 -max_len=4096
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: python -m pip install -r tests/requirements.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - run: python tests/differential.py --cstone build/cstone
      - run: python tests/architectures.py --cstone build/cstone
      - run: python tests/emulation.py --cstone build/cstone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oracle-reports
          path: |
            work/architecture-tests/report.json
            work/execution-tests/report.json
